<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Control Plane</title>
<style>
  :root { --bg:#fff; --fg:#1b1f24; --muted:#6a737d; --line:#d8dee4; --card:#f6f8fa; --warn:#9a6700; --bad:#cf222e; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22; --warn:#d29922; --bad:#f85149; --ok:#3fb950; } }
  * { box-sizing:border-box }
  body { margin:0 auto; padding:16px; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, sans-serif; max-width:980px }
  header { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap }
  h1 { font-size:18px; margin:0 } h2 { font-size:12px; margin:22px 0 8px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted) }
  .card { border:1px solid var(--line); border-radius:8px; padding:10px 12px; margin-bottom:8px; background:var(--card) }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap }
  .muted { color:var(--muted) } .grow { flex:1; min-width:0 } .small { font-size:12px }
  input, select, textarea { font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; min-width:0 }
  button { font:inherit; padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:inherit; cursor:pointer }
  button:disabled { opacity:.5; cursor:default }
  button.allow { border-color:var(--ok); color:var(--ok) } button.deny { border-color:var(--bad); color:var(--bad) }
  pre { overflow:auto; max-height:360px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px; font:12px/1.4 ui-monospace, monospace; margin:8px 0 0; white-space:pre }
  #banner { display:none; padding:8px 12px; border:1px solid var(--warn); color:var(--warn); border-radius:6px; margin:10px 0 }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--muted); flex:none }
  .needs-input { background:var(--warn) } .working { background:var(--ok) } .error { background:var(--bad) }
  #log { max-height:220px; overflow:auto; font:12px/1.5 ui-monospace, monospace }
  form.start { display:grid; grid-template-columns: 110px 1fr 160px; gap:8px }
  form.start textarea { grid-column: 1 / -1; min-height:56px }
  @media (max-width:640px) { form.start { grid-template-columns:1fr } }
</style>
</head>
<body>
<header><h1>Nexus Control Plane</h1><span class="muted small" id="who"></span></header>
<div class="muted small">Terminals stay in Nexus. This page starts, guides, approves and stops the agents it supervises.</div>
<div id="banner"></div>

<h2>Approvals</h2><div id="approvals"></div>

<h2>Start a task</h2>
<form class="start card" id="start">
  <select name="agent" aria-label="Agent"><option>claude</option><option>codex</option><option>copilot</option><option>gemini</option><option>aider</option></select>
  <input name="cwd" placeholder="Working directory on the Nexus host" required aria-label="Working directory">
  <input name="name" placeholder="Label" aria-label="Label">
  <textarea name="prompt" placeholder="First prompt (optional)" aria-label="First prompt"></textarea>
  <div class="row" style="grid-column:1/-1"><button type="submit">Start</button><span class="muted small" id="start-msg"></span></div>
</form>

<h2>Tasks</h2><div id="tasks"></div>
<h2>Events</h2><div id="log" class="card"></div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const api = (path, method = 'GET', body) =>
  fetch(path, { method, headers: body ? { 'content-type': 'application/json' } : {}, body: body && JSON.stringify(body) })
    .then(async (r) => { const j = await r.json().catch(() => ({})); if (!r.ok) throw new Error(j.error || r.statusText); return j; });
const ago = (t) => { const s = Math.round((Date.now() - t) / 1000); return s < 60 ? `${s}s` : s < 3600 ? `${Math.round(s / 60)}m` : `${Math.round(s / 3600)}h`; };
const open = new Set();   // task ids with their diff expanded
const drafts = {};        // unsent guide text, kept across re-renders

function approvalCard(a) {
  const opts = a.options.map((o) => `<button class="${o.kind === 'approve' ? 'allow' : o.kind === 'deny' ? 'deny' : ''}" data-approval="${a.id}" data-key="${esc(o.key)}"
      data-kind="${o.kind === 'deny' ? 'deny' : 'allow'}" title="Type ${esc(o.key)}">${esc(o.key)}. ${esc(o.label)}</button>`).join('');
  return `<div class="card">
    <div class="row"><span class="dot needs-input"></span><b class="grow">${esc(a.detail || 'Input needed')}</b>
      <span class="muted small">waiting ${ago(a.created_at)} · expires ${new Date(a.expires_at).toLocaleTimeString()}</span></div>
    <div class="muted small">session ${esc(a.session_id)}</div>
    ${a.tail ? `<pre>${esc(a.tail)}</pre>` : ''}
    <div class="row" style="margin-top:8px">
      <button class="allow" data-approval="${a.id}" data-kind="allow"><b>Allow once</b></button>
      <button class="deny" data-approval="${a.id}" data-kind="deny"><b>Deny</b></button>
      <span class="muted small">or pick:</span> ${opts}
    </div></div>`;
}

function taskCard(t) {
  const live = t.session_id && !['stopped', 'exited'].includes(t.status);
  return `<div class="card">
    <div class="row"><span class="dot ${esc(t.status)}"></span><b>${esc(t.name)}</b>
      <span class="muted grow small">${esc(t.status)} · ${esc(t.cwd)} · ${ago(t.updated_at)} ago</span>
      <button data-diff="${t.task_id}">${open.has(t.task_id) ? 'Hide diff' : 'Diff'}</button>
      <button data-stop="${t.task_id}" ${live ? '' : 'disabled'}>Stop</button></div>
    ${live ? `<form class="row" data-guide="${t.task_id}" style="margin-top:8px">
      <input class="grow" name="text" placeholder="Guide the agent…" value="${esc(drafts[t.task_id] || '')}" data-draft="${t.task_id}">
      <button type="submit">Send</button></form>` : ''}
    <div id="diff-${t.task_id}"></div></div>`;
}

function renderDiff(id, d) {
  const files = d.untracked.map((f) => `\n=== new file: ${f.path}${f.binary ? ' (binary)' : ''}\n${f.content ?? ''}`).join('');
  $('diff-' + id).innerHTML = `<pre>${esc(d.status)}\n${esc(d.diff) || '(no changes to tracked files)'}${esc(files)}${d.truncated ? '\n… truncated' : ''}</pre>`;
}

async function refresh() {
  const [tasks, approvals] = await Promise.all([api('/api/tasks'), api('/api/approvals?status=pending')]);
  if (document.activeElement?.dataset?.draft) return; // don't clobber typing; the next event re-renders
  $('approvals').innerHTML = approvals.length ? approvals.map(approvalCard).join('') : '<div class="muted">Nothing waiting.</div>';
  $('tasks').innerHTML = tasks.map(taskCard).join('') || '<div class="muted">No tasks.</div>';
  for (const id of open) api(`/api/tasks/${id}/diff`).then((d) => renderDiff(id, d), () => {});
}

function log(text) {
  $('log').insertAdjacentHTML('afterbegin', `<div>${new Date().toLocaleTimeString()} ${esc(text)}</div>`);
}

document.addEventListener('input', (e) => { if (e.target.dataset.draft) drafts[e.target.dataset.draft] = e.target.value; });

document.addEventListener('click', async (e) => {
  const b = e.target.closest('button'); if (!b || b.type === 'submit') return;
  b.disabled = true;
  try {
    if (b.dataset.approval) {
      await api(`/api/approvals/${b.dataset.approval}/${b.dataset.kind}`, 'POST', b.dataset.key ? { optionKey: b.dataset.key } : {});
    } else if (b.dataset.stop) {
      if (!confirm('Close this terminal and everything running in it?')) return;
      await api(`/api/tasks/${b.dataset.stop}/stop`, 'POST', {});
    } else if (b.dataset.diff) {
      const id = b.dataset.diff;
      if (open.has(id)) { open.delete(id); $('diff-' + id).innerHTML = ''; b.textContent = 'Diff'; return; }
      open.add(id); b.textContent = 'Hide diff';
      renderDiff(id, await api(`/api/tasks/${id}/diff`));
      return;
    }
    await refresh();
  } catch (err) { alert(err.message); await refresh(); }
  finally { b.disabled = false; }
});

document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  const btn = f.querySelector('button[type=submit]'); btn.disabled = true;
  try {
    if (f.id === 'start') {
      const body = Object.fromEntries(new FormData(f));
      $('start-msg').textContent = 'Starting…';
      const t = await api('/api/tasks', 'POST', body);
      $('start-msg').textContent = `Started ${t.name}`;
      f.reset();
    } else if (f.dataset.guide) {
      const text = f.text.value.trim(); if (!text) return;
      await api(`/api/tasks/${f.dataset.guide}/prompt`, 'POST', { text });
      delete drafts[f.dataset.guide];
      f.text.blur();
    }
    await refresh();
  } catch (err) {
    if (f.id === 'start') $('start-msg').textContent = err.message; else alert(err.message);
  } finally { btn.disabled = false; }
});

function setStatus(s) {
  $('banner').style.display = s.online ? 'none' : 'block';
  $('banner').textContent = `Nexus is unreachable${s.lastError ? ` (${s.lastError})` : ''}. State below may be stale and nothing is being enforced.`;
}

const es = new EventSource('/api/events');
es.addEventListener('agent', (e) => { const d = JSON.parse(e.data); log(`${d.name} → ${d.state}${d.detail ? ' · ' + d.detail : ''}`); refresh(); });
es.addEventListener('approval', (e) => { const a = JSON.parse(e.data); if (a.status !== 'pending') log(`approval ${a.status}${a.decision ? ' · ' + a.decision : ''}${a.decided_by ? ' by ' + a.decided_by : ''}`); refresh(); });
es.addEventListener('task', () => refresh());
es.addEventListener('nexus', (e) => { const d = JSON.parse(e.data); setStatus({ online: d.online, lastError: d.error }); if (!d.online) log('nexus: ' + d.error); });
es.addEventListener('status', (e) => setStatus(JSON.parse(e.data)));
api('/api/status').then((s) => { $('who').textContent = `signed in as ${s.user}`; setStatus(s); });
refresh();
</script>
</body>
</html>
